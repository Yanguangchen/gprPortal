<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c1015" media="(prefers-color-scheme: dark)" />
  <title>GPR Image Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body>

  <header class="topbar reveal">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <polygon points="16,3 27.3,9.5 27.3,22.5 16,29 4.7,22.5 4.7,9.5"
                   stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="3" fill="currentColor"/>
        </svg>
        <span class="brand-txt">
          <span class="brand-name">GPR Portal</span>
          <span class="brand-tag">RAK Materials</span>
        </span>
      </div>
      <!-- Sign-in button / user chip rendered by app.js -->
      <div id="user-profile"></div>
    </div>
  </header>

  <main class="app-wrapper">
    <div class="page-head reveal" style="--i:1">
      <h1>Upload GPR scans</h1>
      <p>Add up to 3 radar scans and tag them so your team can find them later.</p>
    </div>

    <!-- Components mount here — all markup generated by JS modules -->
    <div id="upload-mount"></div>
    <div id="gallery-mount"></div>
  </main>

  <!-- Upload success toast -->
  <div class="toast" id="upload-toast" role="status" aria-live="polite" hidden>
    <span class="toast-ic">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </span>
    <div>
      <div class="toast-title">Scan uploaded</div>
      <div class="toast-desc">Added to the gallery.</div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
